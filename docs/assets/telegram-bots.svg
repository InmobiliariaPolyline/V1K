<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
  <title id="t">Los dos bots de Telegram de V1K</title>
  <desc id="d">Arriba: cada mañana a las 08:07 (hora de Lima) GitHub Actions lee la API, arma el resumen y el bot asistente, @v1k_asistente_bot, lo envía a tu Telegram; solo envía y no responde. Abajo: tú escribes un comando o tocas un botón al bot de consultas, @v1k_consultas_bot; el bot lee la base central con el rol de solo lectura y responde al instante, sin inteligencia artificial. Los dos son de solo lectura y solo atienden a los chats autorizados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gB" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa4b2"/></marker>
    <style>
    @keyframes pulso { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .pulso { animation: pulso 2.6s ease-in-out infinite; }
    .pulso2 { animation: pulso 2.6s ease-in-out 1.3s infinite; }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .avion { animation: flota 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
  </defs>
  <rect width="1280" height="540" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="540" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="540" rx="28" fill="url(#gB)"/>
  <rect x="1" y="1" width="1278" height="538" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="52" font-size="13" font-weight="700" letter-spacing="3" fill="#7dd3fc">DOS BOTS · UN MISMO TELEGRAM</text>

    <!-- Carril 1: el resumen te llega solo -->
    <text x="40" y="92" font-size="15" font-weight="700" fill="#e6edf3">1 · Te llega solo, cada mañana</text>
    <g filter="url(#sh)"><rect x="40" y="108" width="300" height="140" rx="22" fill="url(#glass)" stroke="#a78bfa" stroke-opacity="0.55"/></g>
    <circle cx="74" cy="142" r="9" fill="#a78bfa"/><text x="94" y="149" font-size="19" font-weight="700" fill="#f0f6fc">GitHub Actions</text>
    <text x="64" y="180" font-size="13" fill="#c9d1d9">cada día a las 08:07 (hora de Lima)</text>
    <text x="64" y="204" font-size="13" fill="#8b949e">lee la API y arma el resumen</text>
    <rect x="64" y="216" width="170" height="20" rx="10" fill="#a78bfa" fill-opacity="0.18"/><text x="149" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ddd6fe">automático, sin que hagas nada</text>

    <g filter="url(#sh)"><rect x="490" y="108" width="300" height="140" rx="22" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.7"/></g>
    <circle cx="526" cy="146" r="19" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.7"/>
    <g class="avion"><path d="M516 148 L536 138 L531 156 L526 150 L522 154 L522 148 Z" fill="#e0f2fe"/></g>
    <text x="556" y="144" font-size="18" font-weight="700" fill="#f0f6fc">Resumen diario</text>
    <text x="556" y="163" font-size="13" font-family="Consolas,'Courier New',monospace" fill="#7dd3fc">@v1k_asistente_bot</text>
    <text x="514" y="196" font-size="13" fill="#c9d1d9">solo envía · no responde mensajes</text>
    <text x="514" y="218" font-size="13" fill="#8b949e">pulsa Iniciar una sola vez</text>

    <g filter="url(#sh)"><rect x="940" y="108" width="300" height="140" rx="22" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.55"/></g>
    <rect x="968" y="128" width="34" height="58" rx="7" fill="none" stroke="#4ade80" stroke-width="2"/><rect x="975" y="124" width="20" height="4" rx="2" fill="#4ade80"/>
    <rect x="974" y="138" width="22" height="9" rx="3" fill="#4ade80" fill-opacity="0.5"/><rect x="974" y="152" width="22" height="9" rx="3" fill="#4ade80" fill-opacity="0.25"/><rect x="974" y="166" width="14" height="9" rx="3" fill="#4ade80" fill-opacity="0.25"/>
    <text x="1020" y="152" font-size="19" font-weight="700" fill="#f0f6fc">Tú</text>
    <text x="1020" y="174" font-size="13" fill="#c9d1d9">recibes el aviso en el celular</text>
    <text x="964" y="214" font-size="13" fill="#8b949e">qué mirar primero y cambios de la semana</text>

    <path d="M340 178 H488" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M790 178 H938" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M340 178 H488"/></circle>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M790 178 H938"/></circle>

    <!-- Carril 2: tú preguntas -->
    <text x="40" y="294" font-size="15" font-weight="700" fill="#e6edf3">2 · Tú preguntas, responde al instante</text>
    <g filter="url(#sh)"><rect x="40" y="310" width="300" height="140" rx="22" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.55"/></g>
    <rect x="68" y="330" width="34" height="58" rx="7" fill="none" stroke="#4ade80" stroke-width="2"/><rect x="75" y="326" width="20" height="4" rx="2" fill="#4ade80"/>
    <rect x="74" y="340" width="22" height="9" rx="3" fill="#4ade80" fill-opacity="0.25"/><rect x="74" y="354" width="22" height="9" rx="3" fill="#4ade80" fill-opacity="0.5"/>
    <text x="120" y="354" font-size="19" font-weight="700" fill="#f0f6fc">Tú</text>
    <text x="64" y="404" font-size="13" fill="#c9d1d9">escribes /proyectos o tocas un botón</text>
    <text x="64" y="426" font-size="13" fill="#8b949e">ejemplo: /propiedades venta miraflores</text>

    <g filter="url(#sh)"><rect x="490" y="310" width="300" height="140" rx="22" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.7"/></g>
    <circle cx="526" cy="348" r="19" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.7"/>
    <g class="avion"><path d="M516 350 L536 340 L531 358 L526 352 L522 356 L522 350 Z" fill="#e0f2fe"/></g>
    <text x="556" y="346" font-size="18" font-weight="700" fill="#f0f6fc">Consultas</text>
    <text x="556" y="365" font-size="13" font-family="Consolas,'Courier New',monospace" fill="#7dd3fc">@v1k_consultas_bot</text>
    <text x="514" y="398" font-size="13" fill="#c9d1d9">comandos y botones · sin IA</text>
    <text x="514" y="420" font-size="13" fill="#8b949e">solo atiende a chats autorizados</text>

    <g filter="url(#sh)"><rect x="940" y="310" width="300" height="140" rx="22" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.55"/></g>
    <ellipse cx="984" cy="340" rx="22" ry="7" fill="#22d3ee" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.7"/>
    <path d="M962 340 V366 A22 7 0 0 0 1006 366 V340" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="1024" y="354" font-size="19" font-weight="700" fill="#f0f6fc">Neon · central</text>
    <text x="964" y="404" font-size="13" fill="#c9d1d9">rol coze_reader · solo lectura</text>
    <text x="964" y="426" font-size="13" fill="#8b949e">los mismos datos que el panel y Coze</text>

    <path d="M340 366 H488" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M488 396 H340" stroke="#9aa4b2" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arr)"/>
    <path d="M790 366 H938" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M938 396 H790" stroke="#9aa4b2" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arr)"/>
    <text x="414" y="358" text-anchor="middle" font-size="10.5" fill="#8b949e">pregunta</text>
    <text x="414" y="416" text-anchor="middle" font-size="10.5" fill="#8b949e">respuesta</text>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M340 366 H488"/></circle>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="3.6s" begin="0.9s" repeatCount="indefinite" path="M790 366 H938"/></circle>
    <circle class="anim" r="4.5" fill="#86efac" filter="url(#dot)"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M938 396 H790"/></circle>
    <circle class="anim" r="4.5" fill="#86efac" filter="url(#dot)"><animateMotion dur="3.6s" begin="2.7s" repeatCount="indefinite" path="M488 396 H340"/></circle>

    <!-- Pie -->
    <g font-size="13" font-weight="600">
      <rect x="40" y="478" width="300" height="32" rx="16" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.4"/><circle class="pulso" cx="62" cy="494" r="4" fill="#4ade80"/><text x="76" y="499" fill="#bbf7d0">Los dos bots son de solo lectura</text>
      <rect x="360" y="478" width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/><circle class="pulso2" cx="382" cy="494" r="4" fill="#38bdf8"/><text x="396" y="499" fill="#bae6fd">Solo atienden a chats autorizados</text>
      <rect x="700" y="478" width="400" height="32" rx="16" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.4"/><circle class="pulso" cx="722" cy="494" r="4" fill="#a78bfa"/><text x="736" y="499" fill="#ddd6fe">Tu número de chat sirve para los dos</text>
    </g>
  </g>
</svg>
