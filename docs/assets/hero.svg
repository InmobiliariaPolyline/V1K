<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">V1K · Agente de Coze sobre una vista central</title>
  <desc id="d">Tres sistemas (Planner, MRP y Scraper) guardan un resumen en una base central de solo lectura, y un agente de Coze responde preguntas con esos datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gViolet" cx="0.88" cy="0.05" r="0.6"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCyan" cx="0.02" cy="1" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGreen" cx="0.76" cy="0.5" r="0.35"><stop offset="0" stop-color="#4ade80" stop-opacity="0.20"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bbf7d0"/><stop offset="0.55" stop-color="#4ade80"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <!-- Animación: SMIL (puntos que viajan, anillos, barras) en un ciclo de 6 s. Con «reducir movimiento» se ocultan los elementos .anim y queda el dibujo estático. -->
    <style>@media (prefers-reduced-motion: reduce) { .anim { display: none; } }</style>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#4ade80" flood-opacity="0.55"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa4b2"/></marker>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="28" fill="url(#gViolet)"/>
  <rect width="1280" height="420" rx="28" fill="url(#gCyan)"/>
  <rect width="1280" height="420" rx="28" fill="url(#gGreen)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Texto -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="64" y="64" width="372" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="86" cy="81" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="102" y="86" font-size="14" font-weight="600" letter-spacing="1.6" fill="#c9d1d9">VISTA CENTRAL  ·  NEON  ·  COZE</text>
    <text x="60" y="206" font-size="124" font-weight="800" fill="url(#title)" letter-spacing="-3">V1K</text>
    <text x="64" y="256" font-size="30" font-weight="600" fill="#f0f6fc">Un asistente que responde con los datos</text>
    <text x="64" y="294" font-size="30" font-weight="600" fill="#f0f6fc">de tus tres sistemas</text>
    <text x="64" y="340" font-size="17" fill="#8b949e">Planner  ·  MRP  ·  Scraper   →   base central de solo lectura   →   agente de Coze</text>
    <text x="64" y="368" font-size="15" fill="#6e7681">Sin esperar a que ninguna app «despierte»</text>
  </g>

  <!-- Ilustración: sistemas → base central → agente -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <!-- tres sistemas -->
    <g filter="url(#sh)">
      <rect x="690" y="92" width="170" height="58" rx="16" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.55"/>
      <rect x="690" y="186" width="170" height="58" rx="16" fill="url(#glass)" stroke="#fbbf24" stroke-opacity="0.55"/>
      <rect x="690" y="280" width="170" height="58" rx="16" fill="url(#glass)" stroke="#a78bfa" stroke-opacity="0.55"/>
    </g>
    <circle cx="714" cy="121" r="7" fill="#22d3ee"/><text x="732" y="127" font-size="18" font-weight="700" fill="#e6edf3">Planner</text>
    <circle cx="714" cy="215" r="7" fill="#fbbf24"/><text x="732" y="221" font-size="18" font-weight="700" fill="#e6edf3">MRP</text>
    <circle cx="714" cy="309" r="7" fill="#a78bfa"/><text x="732" y="315" font-size="18" font-weight="700" fill="#e6edf3">Scraper</text>
    <text x="706" y="142" font-size="11" fill="#8b949e">proyectos e hitos</text>
    <text x="706" y="236" font-size="11" fill="#8b949e">stock y pedidos</text>
    <text x="706" y="330" font-size="11" fill="#8b949e">propiedades</text>

    <!-- flechas a la base central -->
    <path d="M860 121 C 915 121, 925 215, 975 215" fill="none" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M860 215 H 975" fill="none" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M860 309 C 915 309, 925 215, 975 215" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arr)"/>

    <!-- datos que viajan de cada sistema a la base central (0 s, 0,5 s y 1 s de ciclo) -->
    <g class="anim">
      <circle r="5" fill="#22d3ee" filter="url(#dot)" opacity="0">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.42;1" path="M860 121 C 915 121, 925 215, 975 215"/>
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.06;0.38;0.42;1"/>
      </circle>
      <circle r="5" fill="#fbbf24" filter="url(#dot)" opacity="0">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.46;1" path="M860 215 H 975"/>
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.42;0.46;1"/>
      </circle>
      <circle r="5" fill="#a78bfa" filter="url(#dot)" opacity="0">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.14;0.5;1" path="M860 309 C 915 309, 925 215, 975 215"/>
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.14;0.18;0.46;0.5;1"/>
      </circle>
      <!-- anillos que laten desde la base central -->
      <circle cx="1020" cy="215" r="52" fill="none" stroke="#4ade80" stroke-width="2" opacity="0">
        <animate attributeName="r" values="52;84" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="215" r="52" fill="none" stroke="#4ade80" stroke-width="2" opacity="0">
        <animate attributeName="r" values="52;84" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- base central -->
    <circle cx="1020" cy="215" r="52" fill="url(#hub)" filter="url(#glow)"/>
    <g fill="none" stroke="#052e16" stroke-width="3.4" stroke-linecap="round">
      <ellipse cx="1020" cy="198" rx="22" ry="8"/>
      <path d="M998 198 V232 C998 237 1008 241 1020 241 C1032 241 1042 237 1042 232 V198"/>
      <path d="M998 215 C998 220 1008 224 1020 224 C1032 224 1042 220 1042 215"/>
    </g>
    <text x="1020" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#bbf7d0">central</text>
    <text x="1020" y="308" text-anchor="middle" font-size="11" fill="#8b949e">Neon · solo resúmenes</text>

    <!-- hacia el agente -->
    <path d="M1074 215 H 1112" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arr)"/>
    <g filter="url(#sh)">
      <rect x="1116" y="150" width="130" height="130" rx="20" fill="url(#glass)" stroke="#6366f1" stroke-opacity="0.7"/>
    </g>
    <rect x="1130" y="166" width="102" height="30" rx="12" fill="#6366f1" fill-opacity="0.35"/>
    <text x="1181" y="186" text-anchor="middle" font-size="12" font-weight="600" fill="#e0e7ff">¿Qué va atrasado?</text>
    <rect x="1130" y="206" width="84" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="1130" y="224" width="102" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="1130" y="242" width="64" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
    <g class="anim">
      <!-- el resultado sale hacia el agente y este «escribe» su respuesta (barras que se llenan) -->
      <circle r="5" fill="#4ade80" filter="url(#dot)" opacity="0">
        <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.6;1" path="M1074 215 H 1112"/>
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.58;0.62;1"/>
      </circle>
      <rect x="1130" y="206" width="0" height="8" rx="4" fill="#a5b4fc" fill-opacity="0.85">
        <animate attributeName="width" dur="6s" repeatCount="indefinite" values="0;0;84;84;0;0" keyTimes="0;0.62;0.72;0.94;0.97;1"/>
      </rect>
      <rect x="1130" y="224" width="0" height="8" rx="4" fill="#a5b4fc" fill-opacity="0.7">
        <animate attributeName="width" dur="6s" repeatCount="indefinite" values="0;0;102;102;0;0" keyTimes="0;0.68;0.78;0.94;0.97;1"/>
      </rect>
      <rect x="1130" y="242" width="0" height="8" rx="4" fill="#a5b4fc" fill-opacity="0.7">
        <animate attributeName="width" dur="6s" repeatCount="indefinite" values="0;0;64;64;0;0" keyTimes="0;0.74;0.84;0.94;0.97;1"/>
      </rect>
    </g>
    <text x="1181" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#c7d2fe">Agente de Coze</text>
  </g>
</svg>
