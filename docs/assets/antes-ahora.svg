    <g class="anim"><circle r="5" fill="#4ade80" filter="url(#dot)" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0;0.05;1" path="M792 218 H 900"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0;0.02;0.03;0.05;1"/></circle><circle r="5" fill="#4ade80" filter="url(#dot)" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.1;1" path="M1026 218 H 1118"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.05;0.07;0.08;0.1;1"/></circle></g>
    <text x="688" y="338" font-size="14" fill="#c9d1d9">Leyendo de Neon…</text>
