    <g fill="#9aa4b2" font-weight="800"><text class="zz" x="470" y="144" font-size="16">z</text><text class="zz zz2" x="482" y="138" font-size="13">z</text><text class="zz zz3" x="492" y="133" font-size="10">z</text></g>
    <path d="M172 218 C 220 218, 235 222, 290 222" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 5"/>
    <g opacity="0.72"><rect x="290" y="196" width="210" height="52" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.5"/><circle cx="314" cy="222" r="7" fill="#fbbf24"/><text x="332" y="228" font-size="17" font-weight="700" fill="#e6edf3">MRP</text><text x="332" y="242" font-size="0"> </text></g>
    <g fill="#9aa4b2" font-weight="800"><text class="zz" x="470" y="216" font-size="16">z</text><text class="zz zz2" x="482" y="210" font-size="13">z</text><text class="zz zz3" x="492" y="205" font-size="10">z</text></g>
    <path d="M172 218 C 220 218, 235 294, 290 294" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 5"/>
    <g opacity="0.72"><rect x="290" y="268" width="210" height="52" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.5"/><circle cx="314" cy="294" r="7" fill="#a78bfa"/><text x="332" y="300" font-size="17" font-weight="700" fill="#e6edf3">Scraper</text><text x="332" y="314" font-size="0"> </text></g>
    <g fill="#9aa4b2" font-weight="800"><text class="zz" x="470" y="288" font-size="16">z</text><text class="zz zz2" x="482" y="282" font-size="13">z</text><text class="zz zz3" x="492" y="277" font-size="10">z</text></g>
    <text x="520" y="156" font-size="13" fill="#f2706b" font-weight="700">se duermen</text><text x="520" y="174" font-size="12" fill="#8b949e">de 20 a 90 s</text>
    <text x="68" y="338" font-size="14" fill="#c9d1d9">Esperando a que despierten…</text>
    <rect x="68" y="350" width="524" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <rect class="lento" x="68" y="350" width="524" height="14" rx="7" fill="#f2706b"/>
    <text x="592" y="334" text-anchor="end" font-size="15" font-weight="800" fill="#f2706b">20 – 90 s</text>

    <!-- AHORA -->
    <g filter="url(#sh)"><rect x="660" y="40" width="580" height="360" rx="24" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.5"/></g>
    <rect x="688" y="64" width="96" height="28" rx="14" fill="#4ade80" fill-opacity="0.18"/><text x="736" y="83" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1.5" fill="#4ade80">AHORA</text>
    <text x="800" y="84" font-size="15" fill="#c9d1d9">Una base central que nunca duerme</text>
    <rect x="688" y="190" width="104" height="56" rx="16" fill="#6366f1" fill-opacity="0.22" stroke="#6366f1" stroke-opacity="0.6"/>
    <text x="740" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#c7d2fe">Coze</text>
    <path d="M792 218 H 900" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arr)"/>
    <circle cx="974" cy="218" r="52" fill="url(#hub)" filter="url(#glow)"/>
    <g fill="none" stroke="#052e16" stroke-width="3.4" stroke-linecap="round"><ellipse cx="974" cy="201" rx="22" ry="8"/><path d="M952 201 V235 C952 240 962 244 974 244 C986 244 996 240 996 235 V201"/><path d="M952 218 C952 223 962 227 974 227 C986 227 996 223 996 218"/></g>
