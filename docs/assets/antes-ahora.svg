<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Antes y ahora</title>
  <desc id="d">Antes, cada pregunta esperaba de 20 a 90 segundos a que despertaran las apps. Ahora Coze lee de una base central que nunca duerme y responde en unos 150 milisegundos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gV" cx="0.9" cy="0.05" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#4ade80" flood-opacity="0.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa4b2"/></marker>
    <style>
    .zz { animation: zz 3s ease-in-out infinite; }
    .zz2 { animation-delay: 0.9s; } .zz3 { animation-delay: 1.8s; }
    .lento { transform-box: fill-box; transform-origin: left center; animation: lento 6s linear infinite; }
    .rapido { transform-box: fill-box; transform-origin: left center; animation: rapido 6s ease-out infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 6s ease-out infinite; }
    .reloj { transform-box: fill-box; transform-origin: center; animation: reloj 6s linear infinite; }
    @keyframes zz { 0% { opacity: 0; transform: translate(0, 6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -16px); } }
    @keyframes lento { 0% { transform: scaleX(0); opacity: 1; } 84% { transform: scaleX(1); opacity: 1; } 94% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes rapido { 0% { transform: scaleX(0); opacity: 1; } 7% { transform: scaleX(1); } 94% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes pop { 0%, 6% { opacity: 0; transform: scale(0.5); } 11% { opacity: 1; transform: scale(1.18); } 15%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @keyframes reloj { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="28" fill="url(#gV)"/>
  <rect width="1280" height="440" rx="28" fill="url(#gC)"/>
  <rect x="1" y="1" width="1278" height="438" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <!-- ANTES -->
    <g filter="url(#sh)"><rect x="40" y="40" width="580" height="360" rx="24" fill="url(#glass)" stroke="#f2706b" stroke-opacity="0.45"/></g>
