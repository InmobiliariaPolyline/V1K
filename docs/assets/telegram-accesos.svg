<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="t d">
  <title id="t">Dar acceso al bot desde el panel de V1K</title>
  <desc id="d">Cuatro pasos: la persona pulsa Iniciar en el bot y recibe su número de chat; el administrador abre el módulo Accesos de Telegram del panel con su token de administrador y escribe nombre, teléfono y número de chat; la persona queda guardada en la tabla de accesos de la base con un rol que solo puede tocar esa tabla; el bot le avisa que ya tiene acceso y puede usar los comandos. El número de ejemplo es ficticio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gB" cx="0.5" cy="0.4" r="0.55"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.13"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa4b2"/></marker>
    <style>
    @keyframes e1 { 0%, 2% { opacity: 0; transform: translateY(12px); } 6%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes e2 { 0%, 22% { opacity: 0; transform: translateY(12px); } 26%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes e3 { 0%, 46% { opacity: 0; transform: translateY(12px); } 50%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes e4 { 0%, 66% { opacity: 0; transform: translateY(12px); } 70%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    .e1 { animation: e1 12s ease-out infinite; } .e2 { animation: e2 12s ease-out infinite; } .e3 { animation: e3 12s ease-out infinite; } .e4 { animation: e4 12s ease-out infinite; }
    @keyframes llena { 0%, 30% { opacity: 0; } 34%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .llena { animation: llena 12s linear infinite; }
    @keyframes llena2 { 0%, 36% { opacity: 0; } 40%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .llena2 { animation: llena2 12s linear infinite; }
    @keyframes llena3 { 0%, 42% { opacity: 0; } 46%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .llena3 { animation: llena3 12s linear infinite; }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .pulsa { animation: pulsa 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fila { 0%, 52% { opacity: 0; transform: translateX(-10px); } 56%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    .fila { animation: fila 12s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
  </defs>
  <rect width="1280" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="500" rx="28" fill="url(#gB)"/>
  <rect x="1" y="1" width="1278" height="498" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="52" font-size="13" font-weight="700" letter-spacing="3" fill="#5eead4">DAR ACCESO DESDE EL PANEL · SIN TOCAR VERCEL NI GITHUB</text>

    <!-- 1: la persona -->
    <g class="e1"><g filter="url(#sh)"><rect x="40" y="84" width="270" height="270" rx="22" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.6"/></g>
      <circle cx="72" cy="118" r="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.7"/><text x="72" y="123" text-anchor="middle" font-size="14" font-weight="800" fill="#e0f2fe">1</text>
      <text x="96" y="124" font-size="17" font-weight="700" fill="#f0f6fc">La persona</text>
      <rect x="64" y="150" width="222" height="40" rx="16" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.6"/><text x="175" y="175" text-anchor="middle" font-size="14" font-weight="800" fill="#e0f2fe" letter-spacing="1">INICIAR</text>
      <rect x="64" y="204" width="222" height="76" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="78" y="228" font-size="12.5" fill="#c9d1d9">Este bot es privado.</text>
      <text x="78" y="250" font-size="12.5" fill="#c9d1d9">Tu número de chat es</text>
      <text x="78" y="270" font-size="14" font-weight="800" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</text>
      <text x="64" y="312" font-size="12.5" fill="#8b949e">Se lo envía al administrador,</text><text x="64" y="330" font-size="12.5" fill="#8b949e">con su nombre y su teléfono.</text></g>

    <!-- 2: el módulo del panel -->
    <g class="e2"><g filter="url(#sh)"><rect x="350" y="84" width="330" height="270" rx="22" fill="url(#glass)" stroke="#2dd4bf" stroke-opacity="0.7"/></g>
      <circle cx="382" cy="118" r="14" fill="#2dd4bf" fill-opacity="0.2" stroke="#2dd4bf" stroke-opacity="0.7"/><text x="382" y="123" text-anchor="middle" font-size="14" font-weight="800" fill="#ccfbf1">2</text>
      <text x="406" y="124" font-size="17" font-weight="700" fill="#f0f6fc">Administrador · panel</text>
      <rect x="374" y="140" width="282" height="26" rx="13" fill="#2dd4bf" fill-opacity="0.12"/><path d="M393 150 V147 a4 4 0 0 1 8 0 V150 M391 150 H403 V158 H391 Z" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-linejoin="round"/><text x="412" y="157" font-size="11.5" font-weight="600" fill="#99f6e4">Accesos de Telegram · token de administrador</text>
      <rect x="374" y="176" width="282" height="30" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="386" y="196" font-size="12" fill="#8b949e">Nombre</text><text class="llena" x="470" y="196" font-size="13" fill="#e6edf3">Marta Prueba</text>
      <rect x="374" y="212" width="282" height="30" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="386" y="232" font-size="12" fill="#8b949e">Teléfono</text><text class="llena2" x="470" y="232" font-size="13" fill="#e6edf3">+51 999 777 666</text>
      <rect x="374" y="248" width="282" height="30" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="386" y="268" font-size="12" fill="#8b949e">Número de chat</text><text class="llena3" x="500" y="268" font-size="13" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</text>
      <g class="pulsa"><rect x="374" y="292" width="140" height="40" rx="14" fill="#2dd4bf" fill-opacity="0.9"/><text x="444" y="317" text-anchor="middle" font-size="14" font-weight="800" fill="#042f2e">Dar acceso</text></g></g>

    <!-- 3: la base -->
    <g class="e3"><g filter="url(#sh)"><rect x="720" y="84" width="250" height="270" rx="22" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.6"/></g>
      <circle cx="752" cy="118" r="14" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.7"/><text x="752" y="123" text-anchor="middle" font-size="14" font-weight="800" fill="#cffafe">3</text>
      <text x="776" y="124" font-size="17" font-weight="700" fill="#f0f6fc">Base central</text>
      <ellipse cx="760" cy="156" rx="16" ry="5" fill="#22d3ee" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.7"/><path d="M744 156 V172 A16 5 0 0 0 776 172 V156" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="790" y="166" font-size="12" font-family="Consolas,'Courier New',monospace" fill="#67e8f9">telegram_accesos</text>
      <rect x="744" y="194" width="202" height="22" rx="8" fill="#ffffff" fill-opacity="0.05"/><text x="754" y="209" font-size="10.5" fill="#8b949e">chat · nombre · teléfono · activo</text>
      <g class="fila"><rect x="744" y="222" width="202" height="30" rx="9" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.5"/><text x="754" y="236" font-size="11" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</text><text x="754" y="248" font-size="10" fill="#bbf7d0">Marta Prueba · activo</text></g>
      <text x="744" y="286" font-size="12" fill="#c9d1d9">rol writer_accesos:</text><text x="744" y="304" font-size="12" fill="#8b949e">solo toca esta tabla</text>
      <text x="744" y="326" font-size="12" fill="#8b949e">nombres y teléfonos: solo aquí</text></g>

    <!-- 4: el bot -->
    <g class="e4"><g filter="url(#sh)"><rect x="1010" y="84" width="230" height="270" rx="22" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.6"/></g>
      <circle cx="1042" cy="118" r="14" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.7"/><text x="1042" y="123" text-anchor="middle" font-size="14" font-weight="800" fill="#dcfce7">4</text>
      <text x="1066" y="124" font-size="17" font-weight="700" fill="#f0f6fc">El bot</text>
      <rect x="1030" y="150" width="190" height="62" rx="16" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="1044" y="174" font-size="12.5" font-weight="700" fill="#bbf7d0">Ya tienes acceso</text><text x="1044" y="194" font-size="11.5" fill="#c9d1d9">Escribe /ayuda o usa los botones</text>
      <g font-size="11.5" font-weight="600" text-anchor="middle" fill="#cbd5e1"><rect x="1030" y="226" width="90" height="30" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="1075" y="246">Resumen</text><rect x="1130" y="226" width="90" height="30" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="1175" y="246">Proyectos</text></g>
      <text x="1030" y="290" font-size="12" fill="#c9d1d9">Lee solo los números de chat</text><text x="1030" y="308" font-size="12" fill="#8b949e">activos, nunca nombres ni</text><text x="1030" y="326" font-size="12" fill="#8b949e">teléfonos. Se refresca en 15 s.</text></g>

    <!-- flechas -->
    <path d="M310 219 H346" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M680 219 H716" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M970 219 H1006" stroke="#9aa4b2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="2.4s" repeatCount="indefinite" path="M310 219 H346"/></circle>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M680 219 H716"/></circle>
    <circle class="anim" r="4.5" fill="#ffffff" filter="url(#dot)"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M970 219 H1006"/></circle>

    <!-- pie -->
    <g font-size="13" font-weight="600">
      <rect x="40" y="396" width="380" height="34" rx="17" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.4"/><text x="230" y="418" text-anchor="middle" fill="#99f6e4">Token de administrador, distinto del de lectura</text>
      <rect x="440" y="396" width="400" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/><text x="640" y="418" text-anchor="middle" fill="#bae6fd">El teléfono es tu registro; el número de chat autoriza</text>
      <rect x="860" y="396" width="380" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.4"/><text x="1050" y="418" text-anchor="middle" fill="#ddd6fe">Revocar o quitar cuando quieras</text>
    </g>
    <text x="640" y="470" text-anchor="middle" font-size="13" fill="#8b949e">Datos de ejemplo. Máximo 50 personas; los administradores fijos siguen funcionando aunque la base falle.</text>
  </g>
</svg>
