<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">Usar el bot de consultas de V1K</title>
  <desc id="d">Conversación de ejemplo con el bot de consultas: la persona escribe /resumen, el bot responde con el estado general, lo que hay que mirar primero y la antigüedad de los datos de cada app, y deja al pie los botones Resumen, Datos al día, Proyectos, Materiales, Pedidos, Propiedades, Tendencias y Ayuda. A la derecha, ocho de los dieciséis comandos disponibles y qué responde cada uno. Los datos del ejemplo son ficticios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gB" cx="0.3" cy="0.1" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gV" cx="1" cy="1" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <style>
    @keyframes u1 { 0%, 4% { opacity: 0; transform: translateY(10px); } 7%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes tp { 0%, 10% { opacity: 0; } 12%, 24% { opacity: 1; } 27%, 100% { opacity: 0; } }
    @keyframes r1 { 0%, 26% { opacity: 0; transform: translateY(12px); } 30%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes kb { 0%, 40% { opacity: 0; transform: translateY(10px); } 44%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    .u1 { animation: u1 14s ease-out infinite; } .tp { animation: tp 14s linear infinite; } .r1 { animation: r1 14s ease-out infinite; } .kb { animation: kb 14s ease-out infinite; }
    @keyframes c1 { 0%, 8% { opacity: 0; transform: translateX(14px); } 11%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c2 { 0%, 14% { opacity: 0; transform: translateX(14px); } 17%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c3 { 0%, 20% { opacity: 0; transform: translateX(14px); } 23%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c4 { 0%, 26% { opacity: 0; transform: translateX(14px); } 29%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c5 { 0%, 32% { opacity: 0; transform: translateX(14px); } 35%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c6 { 0%, 38% { opacity: 0; transform: translateX(14px); } 41%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c7 { 0%, 44% { opacity: 0; transform: translateX(14px); } 47%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    @keyframes c8 { 0%, 50% { opacity: 0; transform: translateX(14px); } 53%, 94% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; transform: none; } }
    .c1 { animation: c1 14s ease-out infinite; } .c2 { animation: c2 14s ease-out infinite; } .c3 { animation: c3 14s ease-out infinite; } .c4 { animation: c4 14s ease-out infinite; }
    .c5 { animation: c5 14s ease-out infinite; } .c6 { animation: c6 14s ease-out infinite; } .c7 { animation: c7 14s ease-out infinite; } .c8 { animation: c8 14s ease-out infinite; }
    @keyframes bote { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-5px); opacity: 1; } }
    .b1 { animation: bote 0.9s ease-in-out infinite; } .b2 { animation: bote 0.9s ease-in-out 0.15s infinite; } .b3 { animation: bote 0.9s ease-in-out 0.3s infinite; }
    @keyframes toque { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
    .toque { animation: toque 1.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } .tp { display: none; } }</style>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="560" rx="28" fill="url(#gB)"/>
  <rect width="1280" height="560" rx="28" fill="url(#gV)"/>
  <rect x="1" y="1" width="1278" height="558" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <!-- Chat -->
    <g filter="url(#sh)"><rect x="40" y="30" width="720" height="500" rx="26" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.5"/></g>
    <rect x="40" y="30" width="720" height="60" rx="26" fill="#38bdf8" fill-opacity="0.13"/>
    <circle cx="82" cy="60" r="16" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.7"/><path d="M74 62 L91 54 L87 69 L82 64 L79 67 L79 62 Z" fill="#e0f2fe"/>
    <text x="108" y="56" font-size="15" font-weight="700" fill="#e6edf3">V1K Consultas</text><text x="108" y="74" font-size="11.5" font-family="Consolas,'Courier New',monospace" fill="#7dd3fc">@v1k_consultas_bot · solo lectura</text>

    <g class="u1"><rect x="520" y="108" width="212" height="42" rx="18" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="626" y="135" text-anchor="middle" font-size="16" font-family="Consolas,'Courier New',monospace" fill="#e0f2fe">/resumen</text></g>

    <g class="tp"><rect x="64" y="168" width="84" height="38" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle class="b1" cx="92" cy="187" r="5" fill="#7dd3fc"/><circle class="b2" cx="106" cy="187" r="5" fill="#7dd3fc"/><circle class="b3" cx="120" cy="187" r="5" fill="#7dd3fc"/></g>

    <g class="r1"><rect x="64" y="166" width="560" height="236" rx="20" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="86" y="194" font-size="14.5" font-weight="700" fill="#e6edf3">V1K · jueves 19/11/2026</text>
    <circle cx="92" cy="212" r="5" fill="#f2706b"/><text x="106" y="217" font-size="14" font-weight="700" fill="#fca5a5">Requiere atención</text>
    <text x="86" y="246" font-size="13" fill="#9aa4b2">Qué mirar primero</text>
    <circle cx="92" cy="266" r="5" fill="#f2706b"/><text x="106" y="271" font-size="14" fill="#e6edf3">3 proyectos atrasados · el más antiguo: Torre Miraflores</text>
    <circle cx="92" cy="292" r="5" fill="#fbbf24"/><text x="106" y="297" font-size="14" fill="#e6edf3">Inventario casi sin cargar: 499 de 501 sin existencias</text>
    <circle cx="92" cy="318" r="5" fill="#fbbf24"/><text x="106" y="323" font-size="14" fill="#e6edf3">1 orden de compra con llegada vencida</text>
    <text x="86" y="356" font-size="13" fill="#9aa4b2">Datos al día: mrp 23 h · planner 20 h · scraper 5 h</text>
    <text x="86" y="380" font-size="12" fill="#6b7686">Datos de ejemplo</text></g>

    <g class="kb" font-size="13.5" font-weight="600" text-anchor="middle" fill="#cbd5e1">
      <rect x="64" y="418" width="156" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="142" y="443">Resumen</text>
      <rect x="230" y="418" width="156" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="308" y="443">Alertas</text>
      <rect class="toque" x="396" y="418" width="156" height="40" rx="12" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8"/><text x="474" y="443" fill="#bae6fd">Proyectos</text>
      <rect x="562" y="418" width="170" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="647" y="443">Agenda</text>
      <rect x="64" y="468" width="156" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="142" y="493">Materiales</text>
      <rect x="230" y="468" width="156" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="308" y="493">Pedidos</text>
      <rect x="396" y="468" width="156" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="474" y="493">Mercado</text>
      <rect x="562" y="468" width="170" height="40" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="647" y="493">Buscar</text>
    </g>

    <!-- Comandos -->
    <text x="800" y="62" font-size="13" font-weight="700" letter-spacing="3" fill="#7dd3fc">COMANDOS · 16 EN TOTAL</text>
    <g font-size="13" fill="#9aa4b2">
      <g class="c1"><rect x="800" y="80" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="102" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#7dd3fc">/resumen</text><text x="816" y="121">lo urgente del día y los cambios de la semana</text></g>
      <g class="c2"><rect x="800" y="140" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="162" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#86efac">/proyectos atrasado</text><text x="816" y="181">tabla de estado y avance; toca uno para su ficha</text></g>
      <g class="c3"><rect x="800" y="200" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="222" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#fde68a">/materiales cemento</text><text x="816" y="241">stock bajo su mínimo, con barra y lectura</text></g>
      <g class="c4"><rect x="800" y="260" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="282" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#fdba74">/pedidos vencidos</text><text x="816" y="301">las órdenes que ya debían haber llegado</text></g>
      <g class="c5"><rect x="800" y="320" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="342" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#c4b5fd">/mercado alquiler</text><text x="816" y="361">tabla de precio mediano por distrito</text></g>
      <g class="c6"><rect x="800" y="380" width="440" height="50" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="402" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#67e8f9">/buscar torre</text><text x="816" y="421">busca en proyectos, materiales, pedidos y avisos</text></g>
      <g class="c7"><rect x="800" y="440" width="440" height="40" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="465" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#f9a8d4">/alertas</text><text x="930" y="465">solo lo que requiere atención</text></g>
      <g class="c8"><rect x="800" y="490" width="440" height="40" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/><text x="816" y="515" font-size="14.5" font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#e6edf3">/guia</text><text x="930" y="515">¿Coze, bots o panel? qué usar</text></g>
    </g>
  </g>
</svg>
