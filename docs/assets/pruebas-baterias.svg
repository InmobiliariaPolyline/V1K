    .ok { transform-box: fill-box; transform-origin: center; animation: pop 8s ease-out infinite; }
    .ent { animation: ent 8s ease-out infinite; }
    @keyframes llena { 0%, 5% { transform: scaleX(0); } 30%, 90% { transform: scaleX(1); } 98%, 100% { transform: scaleX(0); } }
    @keyframes ring { 0%, 4% { stroke-dasharray: 0 100; } 36%, 90% { stroke-dasharray: var(--l) 100; } 98%, 100% { stroke-dasharray: 0 100; } }
    @keyframes pop { 0%, 30% { opacity: 0; transform: scale(0.4); } 36% { opacity: 1; transform: scale(1.25); } 40%, 90% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes ent { 0%, 12% { opacity: 0; } 30%, 90% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
