<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="t d">
  <title id="t">De cero a usar el bot de V1K en ocho pasos</title>
  <desc id="d">Ocho pasos para quien nunca usó Telegram: uno, instalar Telegram; dos, registrarse con el teléfono y el código que llega por mensaje; tres, buscar el bot con la lupa por su usuario exacto; cuatro, pulsar el botón Iniciar; cinco, tocar el número de chat que el bot muestra en un recuadro, y se copia solo; seis, enviar ese número al administrador junto con el nombre y el teléfono; siete, el administrador lo escribe en el módulo Accesos de Telegram del panel de V1K con nombre, teléfono y número de chat; ocho, el bot avisa Ya tienes acceso y muestra el menú de botones. El número de ejemplo es ficticio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gB" cx="0.1" cy="0.05" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="gV" cx="0.95" cy="1" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <style>
    @keyframes p1 { 0%, 1% { opacity: 0; transform: translateY(14px); } 4%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p2 { 0%, 12% { opacity: 0; transform: translateY(14px); } 15%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p3 { 0%, 23% { opacity: 0; transform: translateY(14px); } 26%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p4 { 0%, 34% { opacity: 0; transform: translateY(14px); } 37%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p5 { 0%, 45% { opacity: 0; transform: translateY(14px); } 48%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p6 { 0%, 56% { opacity: 0; transform: translateY(14px); } 59%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p7 { 0%, 67% { opacity: 0; transform: translateY(14px); } 70%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes p8 { 0%, 78% { opacity: 0; transform: translateY(14px); } 81%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    .p1 { animation: p1 24s ease-out infinite; } .p2 { animation: p2 24s ease-out infinite; } .p3 { animation: p3 24s ease-out infinite; } .p4 { animation: p4 24s ease-out infinite; }
    .p5 { animation: p5 24s ease-out infinite; } .p6 { animation: p6 24s ease-out infinite; } .p7 { animation: p7 24s ease-out infinite; } .p8 { animation: p8 24s ease-out infinite; }
    @keyframes cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .latido { animation: latido 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sube { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .sube { animation: sube 2s ease-in-out infinite; }
    @keyframes toque { 0% { opacity: 0.9; transform: scale(0.6); } 70%, 100% { opacity: 0; transform: scale(1.5); } }
    .toque { animation: toque 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes copiado { 0%, 35% { opacity: 0; transform: translateY(6px); } 45%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .copiado { animation: copiado 3.6s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
  </defs>
  <rect width="1280" height="610" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="610" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="610" rx="28" fill="url(#gB)"/>
  <rect width="1280" height="610" rx="28" fill="url(#gV)"/>
  <rect x="1" y="1" width="1278" height="608" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="50" font-size="13" font-weight="700" letter-spacing="3" fill="#7dd3fc">DE CERO A USAR EL BOT · OCHO PASOS</text>
    <text x="1240" y="50" text-anchor="end" font-size="13" fill="#8b949e">pasos 1 a 6: la persona · pasos 7 y 8: el administrador y el bot</text>

    <!-- Paso 1: instalar -->
    <g class="p1"><g transform="translate(40 76)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.55"/></g>
      <circle cx="30" cy="34" r="14" fill="#38bdf8" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#e0f2fe">1</text>
      <text x="54" y="40" font-size="17" font-weight="700" fill="#f0f6fc">Instalar Telegram</text>
      <rect x="86" y="62" width="54" height="54" rx="15" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.7"/>
      <path d="M99 91 L127 78 L121 105 L113 97 L107 103 L107 95 Z" fill="#e0f2fe"/>
      <g class="sube"><path d="M170 68 V100 M156 88 L170 102 L184 88" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="22" y="150" font-size="13" fill="#c9d1d9">Desde la tienda de aplicaciones</text>
      <text x="22" y="172" font-size="12.5" fill="#8b949e">o en telegram.org · es gratis</text>
    </g></g>

    <!-- Paso 2: registro -->
    <g class="p2"><g transform="translate(345 76)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#a78bfa" stroke-opacity="0.55"/></g>
      <circle cx="30" cy="34" r="14" fill="#a78bfa" fill-opacity="0.28"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#ede9fe">2</text>
      <text x="54" y="40" font-size="17" font-weight="700" fill="#f0f6fc">Registrarte</text>
      <rect x="40" y="60" width="48" height="60" rx="10" fill="none" stroke="#c4b5fd" stroke-width="2"/><rect x="54" y="64" width="20" height="3.5" rx="1.7" fill="#c4b5fd"/>
      <text x="64" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#ddd6fe">+51</text>
      <path d="M98 90 H118" stroke="#9aa4b2" stroke-width="2"/><path d="M114 85 L120 90 L114 95" fill="none" stroke="#9aa4b2" stroke-width="2"/>
      <g fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.6"><rect x="130" y="74" width="26" height="32" rx="7"/><rect x="160" y="74" width="26" height="32" rx="7"/><rect x="190" y="74" width="26" height="32" rx="7"/><rect x="220" y="74" width="26" height="32" rx="7"/></g>
      <g font-size="16" font-weight="700" fill="#ede9fe" text-anchor="middle"><text x="143" y="97">4</text><text x="173" y="97">8</text><text x="203" y="97">2</text><text x="233" y="97">7</text></g>
      <text x="22" y="150" font-size="13" fill="#c9d1d9">Tu celular con +51 y el código SMS</text>
      <text x="22" y="172" font-size="12.5" fill="#fda4af">Nunca compartas ese código</text>
    </g></g>

    <!-- Paso 3: buscar -->
    <g class="p3"><g transform="translate(650 76)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#22d3ee" stroke-opacity="0.55"/></g>
      <circle cx="30" cy="34" r="14" fill="#22d3ee" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#cffafe">3</text>
      <text x="54" y="40" font-size="17" font-weight="700" fill="#f0f6fc">Buscar el bot</text>
      <rect x="22" y="66" width="241" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#22d3ee" stroke-opacity="0.6"/>
      <circle cx="46" cy="87" r="7" fill="none" stroke="#67e8f9" stroke-width="2.2"/><path d="M51 92 L57 98" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round"/>
      <text x="68" y="92" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#e6edf3">v1k_consultas_bot</text><rect class="cursor" x="212" y="78" width="2" height="18" fill="#67e8f9"/>
      <text x="22" y="150" font-size="13" fill="#c9d1d9">Toca la lupa y escribe el usuario</text>
      <text x="22" y="172" font-size="12.5" fill="#8b949e">o abre t.me/v1k_consultas_bot</text>
    </g></g>

    <!-- Paso 4: iniciar -->
    <g class="p4"><g transform="translate(955 76)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.55"/></g>
      <circle cx="30" cy="34" r="14" fill="#4ade80" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#dcfce7">4</text>
      <text x="54" y="40" font-size="17" font-weight="700" fill="#f0f6fc">Pulsar «Iniciar»</text>
      <circle cx="46" cy="86" r="16" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.7"/><path d="M38 88 L55 80 L51 95 L46 90 L43 93 L43 88 Z" fill="#e0f2fe"/>
      <text x="70" y="82" font-size="13" font-weight="700" fill="#e6edf3">V1K Consultas</text><text x="70" y="98" font-size="10.5" font-family="Consolas,'Courier New',monospace" fill="#7dd3fc">@v1k_consultas_bot</text>
      <g class="latido"><rect x="70" y="108" width="140" height="30" rx="15" fill="#38bdf8" fill-opacity="0.9"/><text x="140" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#082f49" letter-spacing="1">INICIAR</text></g>
      <text x="22" y="164" font-size="13" fill="#c9d1d9">Pulsa INICIAR dentro del chat</text>
      <text x="22" y="186" font-size="12.5" fill="#8b949e">Hazlo en los dos bots</text>
    </g></g>

    <!-- Paso 5: copiar el número -->
    <g class="p5"><g transform="translate(40 312)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#fbbf24" stroke-opacity="0.6"/></g>
      <circle cx="30" cy="34" r="14" fill="#fbbf24" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#fef3c7">5</text>
      <text x="54" y="40" font-size="17" font-weight="700" fill="#f0f6fc">Copiar tu número</text>
      <rect x="20" y="56" width="245" height="84" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="32" y="76" font-size="12" font-weight="700" fill="#e6edf3">🔒 Acceso privado</text>
      <text x="32" y="94" font-size="11" fill="#9aa4b2">Tu número de chat:</text>
      <rect x="30" y="102" width="150" height="26" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="42" y="120" font-size="15" font-weight="800" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</text>
      <circle class="toque" cx="104" cy="115" r="22" fill="none" stroke="#fde68a" stroke-width="2.5"/>
      <g class="copiado"><rect x="186" y="102" width="76" height="26" rx="13" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.7"/><text x="224" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#bbf7d0">Copiado ✓</text></g>
      <text x="22" y="164" font-size="13" fill="#c9d1d9">Toca el número: se copia solo</text>
      <text x="22" y="186" font-size="12.5" fill="#8b949e">Sale en un recuadro del bot</text>
    </g></g>

    <!-- Paso 6: enviar al administrador -->
    <g class="p6"><g transform="translate(345 312)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#f472b6" stroke-opacity="0.55"/></g>
      <circle cx="30" cy="34" r="14" fill="#f472b6" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#fce7f3">6</text>
      <text x="54" y="40" font-size="16" font-weight="700" fill="#f0f6fc">Enviar al administrador</text>
      <rect x="20" y="56" width="245" height="84" rx="14" fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-opacity="0.45"/>
      <text x="32" y="76" font-size="12" fill="#e6edf3">Hola, soy Ana Pérez</text>
      <text x="32" y="94" font-size="12" fill="#e6edf3">Teléfono: +51 999 888 777</text>
      <text x="32" y="112" font-size="12" fill="#e6edf3">Mi número de chat: <tspan font-weight="800" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</tspan></text>
      <g class="sube"><path d="M236 124 L252 117 L249 132 L244 127 L240 130 L240 125 Z" fill="#86efac"/></g>
      <text x="22" y="164" font-size="13" fill="#c9d1d9">Con tu nombre y tu teléfono</text>
      <text x="22" y="186" font-size="12.5" fill="#8b949e">Por WhatsApp o como prefieran</text>
    </g></g>

    <!-- Paso 7: el administrador lo registra en el panel -->
    <g class="p7"><g transform="translate(650 312)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#2dd4bf" stroke-opacity="0.7"/></g>
      <circle cx="30" cy="34" r="14" fill="#2dd4bf" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#ccfbf1">7</text>
      <text x="54" y="40" font-size="16" font-weight="700" fill="#f0f6fc">Registro en el panel</text>
      <rect x="20" y="54" width="245" height="20" rx="10" fill="#2dd4bf" fill-opacity="0.12"/><text x="32" y="68" font-size="10.5" font-weight="600" fill="#99f6e4">Panel V1K · Accesos de Telegram</text>
      <rect x="20" y="80" width="245" height="20" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="28" y="94" font-size="10.5" fill="#8b949e">Nombre</text><text x="100" y="94" font-size="11" fill="#e6edf3">Ana Pérez</text>
      <rect x="20" y="104" width="245" height="20" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="28" y="118" font-size="10.5" fill="#8b949e">Teléfono</text><text x="100" y="118" font-size="11" fill="#e6edf3">+51 999 888 777</text>
      <rect x="20" y="128" width="245" height="20" rx="7" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.5"/><text x="28" y="142" font-size="10.5" fill="#8b949e">Número de chat</text><text x="100" y="142" font-size="11.5" font-weight="800" font-family="Consolas,'Courier New',monospace" fill="#fde68a">123456789</text>
      <g class="latido"><rect x="176" y="154" width="89" height="22" rx="11" fill="#2dd4bf" fill-opacity="0.9"/><text x="220" y="169" text-anchor="middle" font-size="11.5" font-weight="800" fill="#042f2e">Dar acceso</text></g>
      <text x="22" y="164" font-size="12" fill="#c9d1d9">Pega el número que te enviaron</text>
      <text x="22" y="186" font-size="12.5" fill="#8b949e">Con su nombre y teléfono</text>
    </g></g>

    <!-- Paso 8: el bot avisa -->
    <g class="p8"><g transform="translate(955 312)">
      <g filter="url(#sh)"><rect width="285" height="210" rx="22" fill="url(#glass)" stroke="#4ade80" stroke-opacity="0.7"/></g>
      <circle cx="30" cy="34" r="14" fill="#4ade80" fill-opacity="0.25"/><text x="30" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="#dcfce7">8</text>
      <text x="54" y="40" font-size="16" font-weight="700" fill="#f0f6fc">Ya puedes usar el bot</text>
      <rect x="20" y="56" width="245" height="44" rx="14" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.55"/>
      <path d="M34 78 l6 6 l12 -13" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="75" font-size="12.5" font-weight="700" fill="#bbf7d0">Ya tienes acceso</text><text x="62" y="91" font-size="10.5" fill="#c9d1d9">Usa los botones o escribe /ayuda</text>
      <g font-size="11" font-weight="600" text-anchor="middle" fill="#cbd5e1">
        <rect x="20" y="108" width="119" height="26" rx="9" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="80" y="125">Resumen</text>
        <rect x="146" y="108" width="119" height="26" rx="9" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/><text x="206" y="125">Proyectos</text>
      </g>
      <text x="22" y="164" font-size="13" fill="#c9d1d9">El bot te avisa y te saluda</text>
      <text x="22" y="186" font-size="12.5" fill="#8b949e">Revisa el resumen de cada mañana</text>
    </g></g>

    <!-- Progreso y nota -->
    <rect x="40" y="546" width="1200" height="6" rx="3" fill="#ffffff" fill-opacity="0.07"/>
    <rect class="anim" x="40" y="546" width="0" height="6" rx="3" fill="#38bdf8"><animate attributeName="width" values="0;1200;1200;0" keyTimes="0;0.94;0.97;1" dur="24s" repeatCount="indefinite"/></rect>
    <text x="640" y="582" text-anchor="middle" font-size="13" fill="#8b949e">Tu número de chat es lo que te identifica en Telegram, y es el mismo en los dos bots. Si pierdes el acceso, el bot te lo dice con tu número.</text>
  </g>
</svg>
