<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="t d">
  <title id="t">Panel V1K</title>
  <desc id="d">Interfaz web de solo lectura con menú lateral (Inicio, Proyectos, Calendario, Materiales, Pedidos, Propiedades, Explorador de API, Agente de Coze y Sistema), saludo con el estado general, indicadores, alertas automáticas, proyectos por estado en una dona y frescura de las tres apps. Datos de ejemplo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gV" cx="0.95" cy="0" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0.2" cy="1" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2029"/><stop offset="1" stop-color="#151a22"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="hola" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2230"/><stop offset="1" stop-color="#171c27"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
      <style>
    .a { animation: entra 9s ease-out infinite both; animation-delay: var(--d, 0s); }
    .arco { stroke-dasharray: 0 100; animation: arco 9s ease-out infinite both; animation-delay: var(--d, 0s); }
    .anillo { stroke-dasharray: 0 100; animation: anillo 9s ease-out infinite both; animation-delay: var(--d, 0s); }
    .latido { animation: latido 2.4s ease-in-out infinite; }
    @keyframes entra { 0% { opacity: 0; transform: translateY(14px); } 7%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; transform: none; } }
    @keyframes arco { 0%, 4% { stroke-dasharray: 0 100; } 22%, 88% { stroke-dasharray: var(--l) 100; } 96%, 100% { stroke-dasharray: 0 100; } }
    @keyframes anillo { 0%, 4% { stroke-dasharray: 0 100; } 24%, 88% { stroke-dasharray: var(--l) 100; } 96%, 100% { stroke-dasharray: 0 100; } }
    @keyframes latido { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }
    </style>
  </defs>

  <rect width="1280" height="780" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="780" rx="26" fill="url(#gV)"/>
  <rect width="1280" height="780" rx="26" fill="url(#gC)"/>
  <rect x="1" y="1" width="1278" height="778" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

