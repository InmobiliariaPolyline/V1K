      <rect x="864" y="126" width="384" height="104" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
    </g>
    <rect x="32" y="146" width="4" height="64" rx="2" fill="#22d3ee"/><rect x="448" y="146" width="4" height="64" rx="2" fill="#fbbf24"/><rect x="864" y="146" width="4" height="64" rx="2" fill="#a78bfa"/>
    <text x="56" y="158" font-size="16" font-weight="700" fill="#e6edf3">Planner</text><circle cx="392" cy="153" r="5" fill="#4ade80"/>
    <text x="56" y="192" font-size="27" font-weight="800" fill="#f0f6fc">hace 1.6 h</text>
    <text x="56" y="214" font-size="13" fill="#8b949e">Última sincronización: 13/11/2026 12:44</text>
    <text x="472" y="158" font-size="16" font-weight="700" fill="#e6edf3">MRP</text><circle cx="808" cy="153" r="5" fill="#4ade80"/>
    <text x="472" y="192" font-size="27" font-weight="800" fill="#f0f6fc">hace 1.3 h</text>
    <text x="472" y="214" font-size="13" fill="#8b949e">Última sincronización: 13/11/2026 13:02</text>
    <text x="888" y="158" font-size="16" font-weight="700" fill="#e6edf3">Scraper</text><circle cx="1224" cy="153" r="5" fill="#4ade80"/>
    <text x="888" y="192" font-size="27" font-weight="800" fill="#f0f6fc">hace 30 min</text>
    <text x="888" y="214" font-size="13" fill="#8b949e">Última sincronización: 13/11/2026 13:49</text>

