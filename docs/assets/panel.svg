      <rect x="520" y="280" width="228" height="92" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="764" y="280" width="228" height="92" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="1008" y="280" width="240" height="92" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/>
    </g>
    <text x="52" y="326" font-size="34" font-weight="800" fill="#e6edf3">8</text><text x="52" y="351" font-size="13" fill="#8b949e">Proyectos</text>
    <text x="296" y="326" font-size="34" font-weight="800" fill="#f2706b">2</text><text x="296" y="351" font-size="13" fill="#8b949e">Proyectos atrasados</text>
    <text x="540" y="326" font-size="34" font-weight="800" fill="#f2706b">5</text><text x="540" y="351" font-size="13" fill="#8b949e">Tareas atrasadas</text>
    <text x="784" y="326" font-size="34" font-weight="800" fill="#f2706b">42</text><text x="784" y="351" font-size="13" fill="#8b949e">Materiales bajo mínimo (de 120)</text>
    <text x="1028" y="326" font-size="34" font-weight="800" fill="#e6edf3">4,753</text><text x="1028" y="351" font-size="13" fill="#8b949e">Propiedades en el catálogo</text>

    <!-- proyectos atrasados -->
    <g filter="url(#sh)"><rect x="32" y="396" width="610" height="206" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/></g>
    <text x="54" y="428" font-size="16" font-weight="700" fill="#e6edf3">Proyectos atrasados</text>
