      <text x="336" y="400" font-size="14" font-weight="700" fill="#e6edf3">3 proyectos atrasados</text><text x="336" y="418" font-size="12" fill="#8b949e">18 tareas atrasadas en total. El más antiguo: Centro Comercial Andino.</text>
      <rect x="284" y="436" width="564" height="48" rx="12" fill="#f2706b" fill-opacity="0.08"/><rect x="292" y="444" width="32" height="32" rx="10" fill="#f2706b" fill-opacity="0.2"/><text x="304" y="466" text-anchor="middle" font-size="15" font-weight="800" fill="#f2706b">!</text>
      <text x="336" y="456" font-size="14" font-weight="700" fill="#e6edf3">2 pedidos con llegada vencida</text><text x="336" y="474" font-size="12" fill="#8b949e">OC-1040, OC-1041 debían llegar antes de hoy.</text>
      <rect x="284" y="492" width="564" height="44" rx="12" fill="#fbbf24" fill-opacity="0.08"/><rect x="292" y="498" width="32" height="32" rx="10" fill="#fbbf24" fill-opacity="0.2"/><text x="304" y="520" text-anchor="middle" font-size="15" font-weight="800" fill="#fbbf24">▣</text>
      <text x="336" y="512" font-size="14" font-weight="700" fill="#e6edf3">31 de 46 materiales bajo su mínimo</text><text x="336" y="528" font-size="12" fill="#8b949e">Mayor faltante: Ladrillo King Kong 18 huecos.</text>
