    <g font-size="34" font-weight="800"><text x="282" y="286" fill="#e6edf3">10</text><text x="478" y="286" fill="#f2706b">3</text><text x="674" y="286" fill="#fbbf24">31</text><text x="870" y="286" fill="#e6edf3">9</text><text x="1066" y="286" fill="#e6edf3">3.3 K</text></g>
    <g font-size="11.5" fill="#7a8696"><text x="282" y="304">4 en curso · 2 terminados</text><text x="478" y="304">18 tareas atrasadas</text><text x="674" y="304">de 46 materiales</text><text x="870" y="304">Próximo: hace 4 días</text><text x="1066" y="304">96 copiadas al panel</text></g>

    </g>
