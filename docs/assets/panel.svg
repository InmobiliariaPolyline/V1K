    <text x="70" y="465" font-size="15" font-weight="650" fill="#e6edf3">Torre Norte</text><text x="604" y="465" text-anchor="end" font-size="13" fill="#8b949e">40 % de avance</text>
    <text x="70" y="483" font-size="12" fill="#8b949e">Ana · debía terminar el 31/10/2026 · 3 tareas atrasadas</text>
    <rect x="70" y="492" width="534" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/><rect x="70" y="492" width="214" height="6" rx="3" fill="url(#barra)"/>
    <rect x="54" y="516" width="566" height="64" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="70" y="539" font-size="15" font-weight="650" fill="#e6edf3">Casa Sur</text><text x="604" y="539" text-anchor="end" font-size="13" fill="#8b949e">75 % de avance</text>
    <text x="70" y="557" font-size="12" fill="#8b949e">Luis · debía terminar el 05/11/2026 · 2 tareas atrasadas</text>
    <rect x="70" y="566" width="534" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/><rect x="70" y="566" width="400" height="6" rx="3" fill="url(#barra)"/>

    <!-- hitos y pedidos -->
    <g filter="url(#sh)"><rect x="662" y="396" width="586" height="206" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/></g>
    <text x="684" y="428" font-size="16" font-weight="700" fill="#e6edf3">Próximos hitos</text>
    <rect x="684" y="442" width="542" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="700" y="464" font-size="14" font-weight="650" fill="#e6edf3">Vaciado de losa</text><text x="1210" y="464" text-anchor="end" font-size="12" fill="#8b949e">20/11/2026</text>
    <text x="700" y="482" font-size="12" fill="#8b949e">Torre Norte</text>
    <text x="684" y="522" font-size="16" font-weight="700" fill="#e6edf3">Pedidos abiertos</text>
    <rect x="684" y="536" width="542" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="700" y="558" font-size="14" font-weight="650" fill="#e6edf3">OC-0042 · Aceros del Sur</text><text x="1210" y="558" text-anchor="end" font-size="12" fill="#8b949e">llega 18/11/2026</text>
    <text x="700" y="576" font-size="12" fill="#8b949e">enviada · Torre Norte</text>

    <!-- propiedades -->
    <g filter="url(#sh)"><rect x="32" y="626" width="1216" height="106" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.09"/></g>
    <text x="54" y="656" font-size="16" font-weight="700" fill="#e6edf3">Propiedades por portal</text>
    <g font-size="12" fill="#c9d1d9">
      <text x="54" y="682">infocasas · venta</text><rect x="180" y="674" width="860" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="180" y="674" width="860" height="8" rx="4" fill="url(#barraV)"/><text x="1230" y="682" text-anchor="end" fill="#8b949e">2,717</text>
      <text x="54" y="702">infocasas · alquiler</text><rect x="180" y="694" width="860" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="180" y="694" width="520" height="8" rx="4" fill="url(#barraV)"/><text x="1230" y="702" text-anchor="end" fill="#8b949e">1,650</text>
      <text x="54" y="722">adondevivir · venta</text><rect x="180" y="714" width="860" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/><rect x="180" y="714" width="60" height="8" rx="4" fill="url(#barraV)"/><text x="1230" y="722" text-anchor="end" fill="#8b949e">184</text>
    </g>
