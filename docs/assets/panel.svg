<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="t d">
  <title id="t">Panel V1K</title>
  <desc id="d">Interfaz web de solo lectura: frescura de las tres apps, indicadores, proyectos atrasados con su avance, próximos hitos, mayor faltante de stock y propiedades por portal. Datos de ejemplo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gV" cx="0.95" cy="0" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0" cy="1" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2029"/><stop offset="1" stop-color="#151a22"/></linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <linearGradient id="barraV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1280" height="760" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="760" rx="26" fill="url(#gV)"/>
  <rect width="1280" height="760" rx="26" fill="url(#gC)"/>
  <rect x="1" y="1" width="1278" height="758" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <!-- cabecera -->
    <rect x="0" y="0" width="1280" height="76" rx="26" fill="#0b0e13" fill-opacity="0.85"/>
    <rect x="0" y="60" width="1280" height="16" fill="#0b0e13" fill-opacity="0.85"/>
    <line x1="0" y1="76" x2="1280" y2="76" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="32" y="19" width="38" height="38" rx="11" fill="url(#logo)"/>
    <g fill="none" stroke="#052e16" stroke-width="2.2" stroke-linecap="round" transform="translate(32 19) scale(1.1875)"><ellipse cx="16" cy="10.5" rx="7" ry="3"/><path d="M9 10.5V21.5C9 23.2 12.1 24.5 16 24.5C19.9 24.5 23 23.2 23 21.5V10.5"/><path d="M9 16C9 17.7 12.1 19 16 19C19.9 19 23 17.7 23 16"/></g>
    <text x="82" y="38" font-size="21" font-weight="700" fill="#e6edf3">Panel V1K</text>
    <text x="82" y="58" font-size="13" fill="#8b949e">Vista central · solo lectura</text>
    <rect x="800" y="24" width="118" height="28" rx="14" fill="#4ade80" fill-opacity="0.15"/>
    <text x="859" y="43" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.6" fill="#4ade80">CONECTADO</text>
