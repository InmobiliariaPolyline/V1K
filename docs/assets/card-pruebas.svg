<svg xmlns="http://www.w3.org/2000/svg" width="400" height="132" viewBox="0 0 400 132" role="img" aria-label="1162 comprobaciones">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d222b"/><stop offset="1" stop-color="#14181e"/></linearGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.38"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.08"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a78bfa" flood-opacity="0.35"/></filter>
      <linearGradient id="bri" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="rec"><rect x="1" y="1" width="398" height="130" rx="22"/></clipPath>
    <style>
    .respira { animation: respira 4.5s ease-in-out 1.4s infinite; }
    .ico { animation: flota 3.8s ease-in-out 1.4s infinite; }
    .onda { fill: none; stroke: #a78bfa; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; animation: onda 3.2s ease-out 1.4s infinite; }
    .brillo { animation: barrido 6s ease-in-out 2.4s infinite; }
    .parpadeo { animation: parpadeo 2.4s ease-in-out 1.4s infinite; }
    .candado { transform-box: fill-box; transform-origin: 50% 100%; animation: candado 5s ease-in-out 1.4s infinite; }
    .rayo { stroke-dasharray: 100; animation: rayo 2.4s ease-in-out 1.4s infinite; }
    .trazo { stroke-dasharray: 100; stroke-dashoffset: 100; animation: trazo 4s ease-in-out 1.4s infinite; }
    .giro { stroke-dasharray: 100; animation: giro 4s ease-in-out 1.4s infinite; transform-box: fill-box; transform-origin: center; }
    .espera { animation: espera 3s ease-in-out 1.4s infinite; }
    .escudo { transform-box: fill-box; transform-origin: center; animation: escudo 3.2s ease-in-out 1.4s infinite; }
    .hoja { stroke-dasharray: 100; stroke-dashoffset: 100; animation: trazo 4.4s ease-in-out 1.4s infinite; }
    .lineas { animation: lineas 4.4s ease-in-out 1.4s infinite; }
    @keyframes respira { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes onda { 0% { transform: scale(1); opacity: 0.55; } 70%, 100% { transform: scale(1.55); opacity: 0; } }
    @keyframes barrido { 0%, 55% { transform: translateX(-90px); } 100% { transform: translateX(520px); } }
    @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    @keyframes candado { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-2px); } 90% { transform: translateY(0); } }
    @keyframes rayo { 0% { stroke-dashoffset: 100; opacity: 1; } 35%, 70% { stroke-dashoffset: 0; opacity: 1; } 85% { opacity: 0.25; } 100% { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes trazo { 0%, 8% { stroke-dashoffset: 100; } 40%, 82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -100; } }
    @keyframes giro { 0% { stroke-dashoffset: 100; } 45%, 100% { stroke-dashoffset: 0; } }
    @keyframes espera { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes escudo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes lineas { 0%, 20% { opacity: 0.2; } 45%, 85% { opacity: 1; } 100% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="398" height="130" rx="22" fill="url(#cg)" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="1" y="1" width="398" height="130" rx="22" fill="url(#glow)" class="respira"/>
  <g transform="translate(20 28)">
    <circle class="onda" cx="26" cy="26" r="26"/>
    <g class="ico">
    <rect y="3" width="52" height="52" rx="15" fill="#a78bfa" fill-opacity="0.35"/>
    <rect width="52" height="52" rx="15" fill="url(#ig)" stroke="#a78bfa" stroke-opacity="0.55" filter="url(#s)"/>
    <path d="M6 8 Q26 -2 46 8" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
    <circle class="giro" pathLength="100" cx="26" cy="26" r="14" fill="none" stroke="#a78bfa" stroke-width="3"/><path class="trazo" pathLength="100" d="M19 26.5 L24 31.5 L33.5 21" fill="none" stroke="#a78bfa" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="84" y="48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc">1162 comprobaciones</text>
  <text x="84" y="76" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa4b2">API, permisos, sincronización</text>
  <text x="84" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9aa4b2">y datos reales, repetibles</text>
  <g clip-path="url(#rec)"><path class="brillo" d="M0 0H70L40 132H-30Z" fill="url(#bri)"/></g>
</svg>
