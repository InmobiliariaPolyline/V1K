    .arriba { animation: arriba 14.85s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sel { 0% { stroke-opacity: 1; fill-opacity: 0.2; } 8% { stroke-opacity: 1; fill-opacity: 0.2; } 10%, 100% { stroke-opacity: 0.3; fill-opacity: 0.05; } }
    @keyframes arriba { 0% { transform: translateY(-5px) scale(1.1); } 8% { transform: translateY(-5px) scale(1.1); } 10%, 100% { transform: none; } }
    .t0 { animation-delay: 0s; }
    .t1 { animation-delay: 1.35s; }
    .t2 { animation-delay: 2.7s; }
    .t3 { animation-delay: 4.05s; }
    .t4 { animation-delay: 5.4s; }
    .t5 { animation-delay: 6.75s; }
    .t6 { animation-delay: 8.1s; }
    .t7 { animation-delay: 9.45s; }
    .t8 { animation-delay: 10.8s; }
    .t9 { animation-delay: 12.15s; }
    .t10 { animation-delay: 13.5s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
