    .d6 { animation: d6 14.85s ease-out infinite; }
    @keyframes d7 { 0%, 63.6% { opacity: 0; transform: translateY(6px); } 66.3%, 72.5% { opacity: 1; transform: none; } 75.2%, 100% { opacity: 0; transform: none; } }
    .d7 { animation: d7 14.85s ease-out infinite; }
    @keyframes d8 { 0%, 72.7% { opacity: 0; transform: translateY(6px); } 75.4%, 81.6% { opacity: 1; transform: none; } 84.3%, 100% { opacity: 0; transform: none; } }
    .d8 { animation: d8 14.85s ease-out infinite; }
