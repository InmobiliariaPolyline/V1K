    .d1 { animation: d1 14.85s ease-out infinite; }
    @keyframes d2 { 0%, 18.2% { opacity: 0; transform: translateY(6px); } 20.9%, 27.1% { opacity: 1; transform: none; } 29.8%, 100% { opacity: 0; transform: none; } }
    .d2 { animation: d2 14.85s ease-out infinite; }
