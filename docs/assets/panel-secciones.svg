    <g filter="url(#sh)"><rect x="36" y="262" width="1208" height="110" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/></g>
    <g class="d0"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#4ade80">Inicio</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Alertas «qué mirar primero», indicadores y frescura de cada app</text></g>
    <g class="d1"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#34d399">Tendencias</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Cómo cambian en el tiempo proyectos, stock, pedidos y precios</text></g>
    <g class="d2"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#22d3ee">Proyectos</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Tarjetas, línea de tiempo (Gantt) o tabla, con detalle de hitos</text></g>
    <g class="d3"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#60a5fa">Calendario</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Hitos de los proyectos en una cuadrícula mensual y una agenda</text></g>
    <g class="d4"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#fbbf24">Materiales</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Stock bajo el mínimo por categoría, con tabla y exportación</text></g>
    <g class="d5"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#fb923c">Pedidos</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Órdenes de compra abiertas, llegadas vencidas y avance</text></g>
    <g class="d6"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#a78bfa">Propiedades</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Filtros avanzados por operación, distrito, portal y precio</text></g>
    <g class="d7"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#f472b6">Explorador</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Prueba cada consulta de la API: JSON, tabla y curl</text></g>
    <g class="d8"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#818cf8">Agente</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Preguntas sugeridas para Coze y sus herramientas</text></g>
    <g class="d9"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#94a3b8">Sistema</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Latencia, frescura, preferencias y atajos de teclado</text></g>
    <g class="d10"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#2dd4bf">Accesos de Telegram</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">El administrador da o quita acceso al bot con el número de chat y el teléfono (token de administrador)</text></g>
