<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Las nueve secciones del Panel V1K</title>
  <desc id="d">Inicio, Proyectos, Calendario, Materiales, Pedidos, Propiedades, Explorador de API, Agente de Coze y Sistema, resaltadas una a una con su descripción.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gV" cx="0.9" cy="0.05" r="0.55"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gC" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#4ade80" flood-opacity="0.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa4b2"/></marker>
    <style>
    @keyframes d0 { 0%, 0% { opacity: 0; transform: translateY(6px); } 3%, 10.911% { opacity: 1; transform: none; } 13.911%, 100% { opacity: 0; transform: none; } }
    .d0 { animation: d0 13.5s ease-out infinite; }
    @keyframes d1 { 0%, 11.111% { opacity: 0; transform: translateY(6px); } 14.111%, 22.022% { opacity: 1; transform: none; } 25.022%, 100% { opacity: 0; transform: none; } }
    .d1 { animation: d1 13.5s ease-out infinite; }
    @keyframes d2 { 0%, 22.222% { opacity: 0; transform: translateY(6px); } 25.222%, 33.133% { opacity: 1; transform: none; } 36.133%, 100% { opacity: 0; transform: none; } }
    .d2 { animation: d2 13.5s ease-out infinite; }
    @keyframes d3 { 0%, 33.333% { opacity: 0; transform: translateY(6px); } 36.333%, 44.244% { opacity: 1; transform: none; } 47.244%, 100% { opacity: 0; transform: none; } }
    .d3 { animation: d3 13.5s ease-out infinite; }
    @keyframes d4 { 0%, 44.444% { opacity: 0; transform: translateY(6px); } 47.444%, 55.356% { opacity: 1; transform: none; } 58.356%, 100% { opacity: 0; transform: none; } }
    .d4 { animation: d4 13.5s ease-out infinite; }
    @keyframes d5 { 0%, 55.556% { opacity: 0; transform: translateY(6px); } 58.556%, 66.467% { opacity: 1; transform: none; } 69.467%, 100% { opacity: 0; transform: none; } }
    .d5 { animation: d5 13.5s ease-out infinite; }
    @keyframes d6 { 0%, 66.667% { opacity: 0; transform: translateY(6px); } 69.667%, 77.578% { opacity: 1; transform: none; } 80.578%, 100% { opacity: 0; transform: none; } }
    .d6 { animation: d6 13.5s ease-out infinite; }
    @keyframes d7 { 0%, 77.778% { opacity: 0; transform: translateY(6px); } 80.778%, 88.689% { opacity: 1; transform: none; } 91.689%, 100% { opacity: 0; transform: none; } }
    .d7 { animation: d7 13.5s ease-out infinite; }
    @keyframes d8 { 0%, 88.889% { opacity: 0; transform: translateY(6px); } 91.889%, 99.8% { opacity: 1; transform: none; } 100%, 100% { opacity: 0; transform: none; } }
    .d8 { animation: d8 13.5s ease-out infinite; }
    .tile { animation: sel 13.5s ease-in-out infinite; }
    .arriba { animation: arriba 13.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sel { 0% { stroke-opacity: 1; fill-opacity: 0.2; } 10.111% { stroke-opacity: 1; fill-opacity: 0.2; } 12.111%, 100% { stroke-opacity: 0.3; fill-opacity: 0.05; } }
    @keyframes arriba { 0% { transform: translateY(-5px) scale(1.1); } 10.111% { transform: translateY(-5px) scale(1.1); } 12.111%, 100% { transform: none; } }
    .t0 { animation-delay: 0s; }
    .t1 { animation-delay: 1.5s; }
    .t2 { animation-delay: 3s; }
    .t3 { animation-delay: 4.5s; }
    .t4 { animation-delay: 6s; }
    .t5 { animation-delay: 7.5s; }
    .t6 { animation-delay: 9s; }
    .t7 { animation-delay: 10.5s; }
    .t8 { animation-delay: 12s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .anim { display: none; } }</style>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#gV)"/>
  <rect width="1280" height="400" rx="28" fill="url(#gC)"/>
  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="40" y="56" font-size="13" font-weight="700" letter-spacing="2" fill="#6e7681">UN PANEL, NUEVE SECCIONES · SIN GASTAR CRÉDITOS DE COZE</text>
    <g class="arriba t0"><rect class="tile t0" x="36" y="96" width="120" height="124" rx="18" fill="#4ade80" fill-opacity="0.05" stroke="#4ade80" stroke-width="1.6"/>
    <g transform="translate(68 118) scale(1.75)" fill="none" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15 L16 6 L27 15 V26 H19 V19 H13 V26 H5 Z"/></g>
    <text x="96" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Inicio</text></g>
