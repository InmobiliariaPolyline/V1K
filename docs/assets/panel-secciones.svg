    <g transform="translate(204 118) scale(1.75)" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5 L28 11 L16 17 L4 11 Z M4 16 L16 22 L28 16 M4 21 L16 27 L28 21"/></g>
    <text x="232" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Proyectos</text></g>
    <g class="arriba t2"><rect class="tile t2" x="308" y="96" width="120" height="124" rx="18" fill="#60a5fa" fill-opacity="0.05" stroke="#60a5fa" stroke-width="1.6"/>
    <g transform="translate(340 118) scale(1.75)" fill="none" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8 H27 V27 H5 Z M5 14 H27 M11 5 V10 M21 5 V10"/></g>
    <text x="368" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Calendario</text></g>
    <g class="arriba t3"><rect class="tile t3" x="444" y="96" width="120" height="124" rx="18" fill="#fbbf24" fill-opacity="0.05" stroke="#fbbf24" stroke-width="1.6"/>
    <g transform="translate(476 118) scale(1.75)" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 L27 10 V22 L16 28 L5 22 V10 Z M5 10 L16 16 L27 10 M16 16 V28"/></g>
    <text x="504" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Materiales</text></g>
    <g class="arriba t4"><rect class="tile t4" x="580" y="96" width="120" height="124" rx="18" fill="#fb923c" fill-opacity="0.05" stroke="#fb923c" stroke-width="1.6"/>
    <g transform="translate(612 118) scale(1.75)" fill="none" stroke="#fb923c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 H19 V21 H3 Z M19 13 H25 L29 18 V21 H19 M9 24 a2.5 2.5 0 1 0 0.01 0 M23 24 a2.5 2.5 0 1 0 0.01 0"/></g>
    <text x="640" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Pedidos</text></g>
    <g class="arriba t5"><rect class="tile t5" x="716" y="96" width="120" height="124" rx="18" fill="#a78bfa" fill-opacity="0.05" stroke="#a78bfa" stroke-width="1.6"/>
    <g transform="translate(748 118) scale(1.75)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 27 V6 H22 V27 M5 27 H27 M12 11 H14 M16 11 H18 M12 16 H14 M16 16 H18 M12 21 H14 M16 21 H18"/></g>
    <text x="776" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Propiedades</text></g>
    <g class="arriba t6"><rect class="tile t6" x="852" y="96" width="120" height="124" rx="18" fill="#f472b6" fill-opacity="0.05" stroke="#f472b6" stroke-width="1.6"/>
    <g transform="translate(884 118) scale(1.75)" fill="none" stroke="#f472b6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 9 L4 16 L11 23 M21 9 L28 16 L21 23 M18 6 L14 26"/></g>
    <text x="912" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Explorador</text></g>
    <g class="arriba t7"><rect class="tile t7" x="988" y="96" width="120" height="124" rx="18" fill="#818cf8" fill-opacity="0.05" stroke="#818cf8" stroke-width="1.6"/>
    <g transform="translate(1020 118) scale(1.75)" fill="none" stroke="#818cf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7 H27 V21 H15 L9 27 V21 H5 Z M11 13 H21 M11 17 H17"/></g>
    <text x="1048" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Agente</text></g>
    <g class="arriba t8"><rect class="tile t8" x="1124" y="96" width="120" height="124" rx="18" fill="#94a3b8" fill-opacity="0.05" stroke="#94a3b8" stroke-width="1.6"/>
    <g transform="translate(1156 118) scale(1.75)" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7 H26 V13 H6 Z M6 15 H26 V21 H6 Z M10 10 H12 M10 18 H12 M18 27 H14 M16 21 V27"/></g>
    <text x="1184" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e6edf3">Sistema</text></g>
    <g filter="url(#sh)"><rect x="36" y="262" width="1208" height="110" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.1"/></g>
    <g class="d0"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#4ade80">Inicio</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Alertas «qué mirar primero», indicadores y frescura de cada app</text></g>
    <g class="d1"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#22d3ee">Proyectos</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Tarjetas, línea de tiempo (Gantt) o tabla, con detalle de hitos</text></g>
    <g class="d2"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#60a5fa">Calendario</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Hitos de los proyectos en una cuadrícula mensual y una agenda</text></g>
    <g class="d3"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#fbbf24">Materiales</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Stock bajo el mínimo por categoría, con tabla y exportación</text></g>
    <g class="d4"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#fb923c">Pedidos</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Órdenes de compra abiertas, llegadas vencidas y avance</text></g>
    <g class="d5"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#a78bfa">Propiedades</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Filtros avanzados por operación, distrito, portal y precio</text></g>
    <g class="d6"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#f472b6">Explorador</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Prueba cada consulta de la API: JSON, tabla y curl</text></g>
    <g class="d7"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#818cf8">Agente</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Preguntas sugeridas para Coze y sus herramientas</text></g>
    <g class="d8"><text x="640" y="316" text-anchor="middle" font-size="22" font-weight="800" fill="#94a3b8">Sistema</text><text x="640" y="346" text-anchor="middle" font-size="15.5" fill="#c9d1d9">Latencia, frescura, preferencias y atajos de teclado</text></g>
