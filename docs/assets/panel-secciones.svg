    <style>
    @keyframes d0 { 0%, 0% { opacity: 0; transform: translateY(6px); } 2.7%, 8.9% { opacity: 1; transform: none; } 11.6%, 100% { opacity: 0; transform: none; } }
    .d0 { animation: d0 14.85s ease-out infinite; }
