# Avisa (con una solicitud de cambios) cuando hay versiones nuevas o vulnerabilidades en las dependencias.
version: 2
updates:
  - package-ecosystem: npm
    directory: /coze-api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencias]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
