<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner animado de los bots de V1K</title>
<meta name="viewport" content="width=1280">
<style>
  html, body { margin: 0; background: #0a0c10; }
  canvas { display: block; width: 1280px; height: 640px; }
  pre { display: none; }
</style>
</head>
<body>
<!--
  Banner animado de los bots de Telegram. Se dibuja con Canvas 2D como una función del tiempo, así que se puede ver en vivo
  (abrir este archivo, con #v=bienvenida | privado | resumen) y también exportar fotograma a fotograma:
  scripts/generar-banners.mjs lo abre con Chrome sin pantalla, recoge los fotogramas y los une con ffmpeg en un MP4
  (Telegram lo reproduce como un GIF). Solo herramienta de desarrollo: no se despliega ni se carga en el panel.
-->
<canvas id="c" width="1280" height="640"></canvas>
<pre id="salida"></pre>
<script>
const W = 1280, H = 640, PERIODO = 4.8, FPS = 15;
const ctx = document.getElementById('c').getContext('2d');

const VARIANTES = {
  bienvenida: {
    titulo: 'V1K', sub: 'Asistente de consultas', linea: 'Obras · materiales · propiedades',
    chips: ['Solo lectura', 'Privado', 'Sin IA'], icono: 'db', acento: ['#86efac', '#22d3ee'], texto: '#052e16',
  },
  privado: {
    titulo: 'Acceso privado', sub: 'Solo para personas autorizadas', linea: 'Pide tu acceso con tu número de chat',
    chips: ['Solo lectura', 'Privado', 'Tú decides'], icono: 'lock', acento: ['#fde68a', '#fbbf24'], texto: '#451a03',
  },
  resumen: {
    titulo: 'Resumen diario', sub: 'Cada mañana a las 08:07', linea: 'Lo urgente y los cambios de la semana',
    chips: ['Hora de Lima', 'Solo lectura', 'Te llega solo'], icono: 'sol', acento: ['#a5f3fc', '#a78bfa'], texto: '#1e1b4b',
  },
};

const acotar = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const suave = (x) => { x = acotar(x); return x * x * (3 - 2 * x); };
const rebote = (x) => { x = acotar(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const tramo = (t, ini, dur) => acotar((t - ini) / dur);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function texto(t, x, y, { tam = 32, peso = 700, color = '#f0f6fc', alinea = 'left', fuente = 'Segoe UI, Helvetica Neue, Arial, sans-serif' } = {}) {
  ctx.font = `${peso} ${tam}px ${fuente}`; ctx.fillStyle = color; ctx.textAlign = alinea; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, x, y);
}
function conAlfa(a, fn) { ctx.save(); ctx.globalAlpha *= acotar(a); fn(); ctx.restore(); }
function conEscala(cx, cy, s, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }

// ── Iconos (dibujados con trazos, centrados en 0,0, tamaño ~90) ──
function icono(tipo, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (tipo === 'db') {
    ctx.beginPath(); ctx.ellipse(0, -26, 34, 12, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-34, -26); ctx.lineTo(-34, 26); ctx.moveTo(34, -26); ctx.lineTo(34, 26); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, 34, 12, 0, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 26, 34, 12, 0, 0, Math.PI); ctx.stroke();
  } else if (tipo === 'lock') {
    rr(-34, -4, 68, 50, 12); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -8, 22, Math.PI, 0); ctx.moveTo(-22, -8); ctx.lineTo(-22, -4); ctx.moveTo(22, -8); ctx.lineTo(22, -4); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 20, 5, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 29, Math.sin(a) * 29); ctx.lineTo(Math.cos(a) * 40, Math.sin(a) * 40); ctx.stroke(); }
  }
  ctx.restore();
}

function fondo(v) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#0d1015'); g.addColorStop(1, '#0a0c10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  let r = ctx.createRadialGradient(W * 0.92, 0, 0, W * 0.92, 0, 620); r.addColorStop(0, v.acento[1] + '38'); r.addColorStop(1, v.acento[1] + '00');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  r = ctx.createRadialGradient(0, H, 0, 0, H, 560); r.addColorStop(0, v.acento[0] + '2a'); r.addColorStop(1, v.acento[0] + '00');
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 2; rr(1, 1, W - 2, H - 2, 28); ctx.stroke();
}

function vidrio(x, y, w, h, borde, r = 22) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  rr(x, y, w, h, r); ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill(); ctx.restore();
  rr(x, y, w, h, r); ctx.strokeStyle = borde; ctx.lineWidth = 2; ctx.stroke();
}
function punto(x, y, color, a = 1) {
  conAlfa(a, () => { ctx.save(); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 14; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill(); ctx.restore(); });
}
function viaje(a, b, t, vel, desfase, color, aparece) {
  const u = ((t * vel + desfase) % 1 + 1) % 1;
  const e = suave(tramo(t, aparece, 0.5));
  punto(a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, color, e * Math.sin(Math.PI * u) * 1.4);
}

// ── Escena derecha de cada variante ──
function escenaBienvenida(t, v) {
  const apps = [['Planner', '#22d3ee'], ['MRP', '#fbbf24'], ['Scraper', '#a78bfa']];
  const hub = [1010, 320];
  apps.forEach(([nombre, col], i) => {
    const y = 176 + i * 112, e = suave(tramo(t, 0.7 + i * 0.18, 0.5));
    conAlfa(e, () => { ctx.save(); ctx.translate((1 - e) * 30, 0);
      vidrio(690, y, 190, 84, col + 'aa', 20);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(724, y + 42, 9, 0, Math.PI * 2); ctx.fill();
      texto(nombre, 746, y + 52, { tam: 28, color: '#f0f6fc' });
      ctx.restore(); });
    ctx.strokeStyle = col + '66'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
    conAlfa(e, () => { ctx.beginPath(); ctx.moveTo(880, y + 42); ctx.lineTo(hub[0] - 52, hub[1]); ctx.stroke(); }); ctx.setLineDash([]);
    viaje([880, y + 42], [hub[0] - 52, hub[1]], t, 0.42, i / 3, col, 1.3);
  });
  const eh = rebote(tramo(t, 1.0, 0.7));
  conEscala(hub[0], hub[1], Math.max(0.01, eh), () => {
    ctx.save(); ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 30; rr(hub[0] - 52, hub[1] - 52, 104, 104, 30);
    const g = ctx.createLinearGradient(hub[0] - 52, hub[1] - 52, hub[0] + 52, hub[1] + 52); g.addColorStop(0, '#86efac'); g.addColorStop(1, '#16a34a'); ctx.fillStyle = g; ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(hub[0], hub[1]); ctx.scale(0.62, 0.62); icono('db', '#052e16'); ctx.restore();
  });
  texto('Neon', hub[0], hub[1] + 88, { tam: 22, color: '#9aa4b2', alinea: 'center', peso: 600 });
  // burbuja de chat
  const eb = suave(tramo(t, 1.6, 0.5));
  conAlfa(eb, () => { ctx.save(); ctx.translate(0, (1 - eb) * 16);
    vidrio(1110, 258, 134, 124, 'rgba(129,140,248,0.7)', 22);
    ctx.fillStyle = 'rgba(129,140,248,0.5)'; rr(1126, 280, 102, 18, 9); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.18)'; rr(1126, 308, 80, 14, 7); ctx.fill(); rr(1126, 332, 92, 14, 7); ctx.fill();
    ctx.restore(); });
  viaje([hub[0] + 52, hub[1]], [1108, hub[1]], t, 0.55, 0, '#4ade80', 1.8);
  viaje([hub[0] + 52, hub[1]], [1108, hub[1]], t, 0.55, 0.5, '#86efac', 1.8);
}

function escenaPrivado(t, v) {
  const pasos = [['1', 'Pulsa «Iniciar»'], ['2', 'Copia tu número de chat'], ['3', 'Envíalo al administrador']];
  pasos.forEach(([n, txt], i) => {
    const y = 150 + i * 130, e = suave(tramo(t, 0.7 + i * 0.35, 0.5));
    conAlfa(e, () => { ctx.save(); ctx.translate((1 - e) * 40, 0);
      vidrio(660, y, 540, 92, 'rgba(251,191,36,0.6)', 24);
      ctx.fillStyle = 'rgba(251,191,36,0.25)'; ctx.beginPath(); ctx.arc(714, y + 46, 26, 0, Math.PI * 2); ctx.fill();
      texto(n, 714, y + 57, { tam: 32, color: '#fde68a', alinea: 'center', peso: 800 });
      texto(txt, 762, y + 58, { tam: 32, color: '#f0f6fc', peso: 600 });
      ctx.restore(); });
    if (i < 2) {
      conAlfa(e, () => { ctx.strokeStyle = 'rgba(251,191,36,0.4)'; ctx.lineWidth = 3; ctx.setLineDash([4, 8]); ctx.beginPath(); ctx.moveTo(714, y + 92); ctx.lineTo(714, y + 130); ctx.stroke(); ctx.setLineDash([]); });
      viaje([714, y + 92], [714, y + 130], t, 0.6, i * 0.33, '#fde68a', 1.2 + i * 0.35);
    }
  });
}

function escenaResumen(t, v) {
  const eb = suave(tramo(t, 0.6, 0.6));
  conAlfa(eb, () => { ctx.save(); ctx.translate(0, (1 - eb) * 24);
    vidrio(660, 120, 560, 400, 'rgba(165,243,252,0.5)', 28);
    texto('Resumen · jueves 19/11', 696, 176, { tam: 26, color: '#e6edf3' });
    ctx.restore(); });
  const lineas = [['#f2706b', '3 proyectos atrasados'], ['#fbbf24', 'Inventario casi sin cargar'], ['#a5f3fc', '1 pedido con llegada vencida'], ['#86efac', 'Todos los datos al día']];
  lineas.forEach(([col, txt], i) => {
    const e = suave(tramo(t, 1.2 + i * 0.4, 0.45));
    conAlfa(e, () => { ctx.save(); ctx.translate((1 - e) * 26, 0);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(704, 236 + i * 62, 10, 0, Math.PI * 2); ctx.fill();
      texto(txt, 732, 246 + i * 62, { tam: 28, color: '#e6edf3', peso: 600 });
      ctx.restore(); });
  });
}

function dibuja(tt, nombre) {
  const v = VARIANTES[nombre] ?? VARIANTES.bienvenida;
  const t = tt % PERIODO;
  ctx.clearRect(0, 0, W, H);
  fondo(v);
  const alfa = Math.min(acotar(t / 0.25), acotar((PERIODO - t) / 0.4));
  ctx.save(); ctx.globalAlpha = alfa;

  // Logo (tarjeta con degradado e icono), con rebote al entrar y balanceo suave
  const el = rebote(tramo(t, 0.05, 0.7));
  const bal = Math.sin((t / PERIODO) * Math.PI * 2) * 5;
  conEscala(155, 190 + bal, Math.max(0.01, el), () => {
    ctx.save(); ctx.shadowColor = v.acento[1]; ctx.shadowBlur = 36; rr(80, 115 + bal, 150, 150, 40);
    const g = ctx.createLinearGradient(80, 115, 230, 265); g.addColorStop(0, v.acento[0]); g.addColorStop(1, v.acento[1]); ctx.fillStyle = g; ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(155, 190 + bal); ctx.scale(1.05, 1.05); icono(v.icono, v.texto); ctx.restore();
  });
  // Títulos
  const l1 = suave(tramo(t, 0.3, 0.5)), l2 = suave(tramo(t, 0.5, 0.5)), l3 = suave(tramo(t, 0.7, 0.5));
  conAlfa(l1, () => texto(v.titulo, 80, 352 + (1 - l1) * 18, { tam: v.titulo.length > 6 ? 64 : 120, color: '#f0f6fc', peso: 800 }));
  conAlfa(l2, () => texto(v.sub, 82, 418 + (1 - l2) * 16, { tam: 36, color: v.acento[0], peso: 700 }));
  conAlfa(l3, () => texto(v.linea, 82, 470 + (1 - l3) * 14, { tam: 28, color: '#9aa4b2', peso: 500 }));
  // Chips
  let x = 80;
  v.chips.forEach((c, i) => {
    ctx.font = '700 24px Segoe UI, Helvetica Neue, Arial, sans-serif';
    const w = ctx.measureText(c).width + 56, e = rebote(tramo(t, 1.3 + i * 0.3, 0.5));
    conEscala(x + w / 2, 556, Math.max(0.01, e), () => {
      rr(x, 530, w, 52, 26); ctx.fillStyle = v.acento[0] + '24'; ctx.fill(); ctx.strokeStyle = v.acento[0] + '88'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = v.acento[0]; ctx.beginPath(); ctx.arc(x + 26, 556, 6, 0, Math.PI * 2); ctx.fill();
      texto(c, x + 42, 565, { tam: 24, color: '#f0f6fc', peso: 700 });
    });
    x += w + 16;
  });
  // Escena de la derecha
  if (nombre === 'privado' || nombre === 'resumen') { ctx.save(); ctx.translate(50, 0); (nombre === 'privado' ? escenaPrivado : escenaResumen)(t, v); ctx.restore(); } else escenaBienvenida(t, v);
  ctx.restore();
}

const parametros = new URLSearchParams(location.hash.slice(1));
const variante = parametros.get('v') || 'bienvenida';

if (parametros.get('export')) {
  // Exporta todos los fotogramas del ciclo como PNG en base64 (uno por línea) dentro de <pre id="salida">
  const total = Math.round(PERIODO * FPS), lineas = [];
  for (let i = 0; i < total; i++) { dibuja(i / FPS, variante); lineas.push(document.getElementById('c').toDataURL('image/png').split(',')[1]); }
  document.getElementById('salida').textContent = `FOTOGRAMAS ${total} ${FPS}\n${lineas.join('\n')}\nFIN`;
} else {
  const inicio = performance.now();
  const fijo = parametros.get('t');
  if (fijo !== null) dibuja(Number(fijo), variante);
  else (function bucle() { dibuja((performance.now() - inicio) / 1000, variante); requestAnimationFrame(bucle); })();
}
</script>
</body>
</html>
